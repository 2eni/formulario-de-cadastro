<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <main>
        <h1>Cadastro</h1>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="cep">Cep:</label>
            <input type="number" id="cep" placeholder="Ex: XXXXXXXX">

            <label for="estado">Estado:</label>
            <input type="text" id="estado" placeholder="Ex: São Paulo">

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" placeholder="Ex: São Paulo">

            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro" placeholder="Ex: Rua....">

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" placeholder="Ex: Bairro....">

            <label for="numero">Numero:</label>
            <input type="number" id="numero" placeholder="Ex: 98">
            
            <button type="submit" id="btn">Cadastrar</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
